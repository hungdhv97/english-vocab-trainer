openapi: 3.0.3
info:
  title: English Coach - Leaderboard Game Tabs API
  description: |
    API endpoints for the Leaderboard Page Redesign with Game Tabs feature.
    
    This specification documents the existing API endpoints used by the redesigned leaderboard page.
    No new endpoints are required - this is a frontend-only feature that uses existing backend APIs.
    
    **Feature**: Leaderboard Page Redesign with Game Tabs
    **Branch**: 007-leaderboard-game-tabs
    **Version**: 1.0.0
  version: 1.0.0
  contact:
    name: English Coach Team

servers:
  - url: http://localhost:8080/api/v1
    description: Local development server
  - url: https://api.english-vocab-trainer.com/api/v1
    description: Production server

tags:
  - name: games
    description: Game listing and metadata
  - name: leaderboards
    description: Game leaderboard data
  - name: vocab-quiz
    description: Vocabulary quiz specific endpoints
  - name: cefr-levels
    description: CEFR level endpoints

paths:
  /games:
    get:
      summary: List all active games
      description: |
        Retrieves all active games with their metadata for display as tabs on the leaderboard page.
        
        **Authorization**: None (public endpoint)
        
        **Usage**: Called on leaderboard page mount to populate game tabs.
        Games are sorted by display_order to determine default selected game.
      operationId: listGames
      tags:
        - games
      responses:
        '200':
          description: Successful response with list of active games
          content:
            application/json:
              schema:
                type: object
                properties:
                  games:
                    type: array
                    items:
                      $ref: '#/components/schemas/Game'
                    description: Array of active games ordered by display_order then name
              examples:
                success:
                  summary: Multiple games available
                  value:
                    games:
                      - game_id: 1
                        code: "word-scramble"
                        name: "Word Scramble"
                        description: "Unscramble letters to form correct English words."
                        icon_path: "/games/word-scramble.svg"
                        category: "vocabulary"
                        display_order: 1
                        is_active: true
                        created_at: "2025-11-01T00:00:00Z"
                        updated_at: "2025-11-01T00:00:00Z"
                      - game_id: 2
                        code: "vocab-quiz"
                        name: "Vocabulary Quiz"
                        description: "Match words with their definitions."
                        icon_path: "/games/vocab-quiz.svg"
                        category: "vocabulary"
                        display_order: 2
                        is_active: true
                        created_at: "2025-11-01T00:00:00Z"
                        updated_at: "2025-11-01T00:00:00Z"
        '500':
          $ref: '#/components/responses/InternalServerError'

  /games/{gameId}/leaderboard:
    get:
      summary: Get leaderboard for a specific game
      description: |
        Retrieves the top 10 players for a specific game, ranked by best score.
        
        **Authorization**: None (public endpoint)
        
        **Usage**: Called when a game tab is selected (except vocab-quiz which uses a different endpoint).
        Results are cached per game to avoid unnecessary refetches.
      operationId: getGameLeaderboard
      tags:
        - leaderboards
      parameters:
        - name: gameId
          in: path
          required: true
          description: The ID of the game
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: Successful response with leaderboard entries
          content:
            application/json:
              schema:
                type: object
                properties:
                  game_id:
                    type: integer
                    description: The game ID
                  leaderboard:
                    type: array
                    items:
                      $ref: '#/components/schemas/LeaderboardEntry'
                    description: Array of top 10 leaderboard entries (may be empty)
              examples:
                success:
                  summary: Leaderboard with entries
                  value:
                    game_id: 1
                    leaderboard:
                      - user_id: 1
                        username: "player1"
                        score: 950
                        rank: 1
                      - user_id: 2
                        username: "player2"
                        score: 850
                        rank: 2
                empty:
                  summary: No leaderboard entries
                  value:
                    game_id: 1
                    leaderboard: []
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /vocab-quiz/leaderboard:
    get:
      summary: Get vocabulary quiz leaderboard
      description: |
        Retrieves the top 10 players for vocabulary quiz game filtered by CEFR level and translation direction.
        Players must have played at least 1 games to appear on the leaderboard.
        Results are ranked by accuracy percentage.
        
        **Authorization**: None (public endpoint)
        
        **Usage**: Called by VocabQuizLeaderboard component when vocab-quiz tab is selected.
        Called again when CEFR level or translation direction changes.
      operationId: getVocabQuizLeaderboard
      tags:
        - vocab-quiz
        - leaderboards
      parameters:
        - name: game_id
          in: query
          required: true
          description: The ID of the vocab-quiz game
          schema:
            type: integer
            minimum: 1
        - name: cefr_level_id
          in: query
          required: true
          description: The CEFR level ID (A1, A2, B1, B2, C1, C2)
          schema:
            type: integer
            minimum: 1
        - name: translation_direction
          in: query
          required: true
          description: Translation direction
          schema:
            type: string
            enum: [en-to-vi, vi-to-en]
      responses:
        '200':
          description: Successful response with leaderboard entries
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VocabQuizLeaderboardResponse'
              examples:
                success:
                  summary: Leaderboard with entries
                  value:
                    game_id: 2
                    cefr_level_id: 1
                    cefr_level_code: "A1"
                    translation_direction: "en-to-vi"
                    leaderboard:
                      - user_id: 1
                        username: "player1"
                        accuracy_percentage: 95.5
                        games_played: 10
                        rank: 1
                      - user_id: 2
                        username: "player2"
                        accuracy_percentage: 92.0
                        games_played: 8
                        rank: 2
                empty:
                  summary: No leaderboard entries
                  value:
                    game_id: 2
                    cefr_level_id: 1
                    cefr_level_code: "A1"
                    translation_direction: "en-to-vi"
                    leaderboard: []
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /cefr-levels:
    get:
      summary: List all CEFR levels
      description: |
        Retrieves all CEFR levels (A1, A2, B1, B2, C1, C2) for vocabulary quiz leaderboard filtering.
        
        **Authorization**: None (public endpoint)
        
        **Usage**: Called on leaderboard page mount to populate CEFR level selector in VocabQuizLeaderboard component.
      operationId: listCefrLevels
      tags:
        - cefr-levels
      responses:
        '200':
          description: Successful response with list of CEFR levels
          content:
            application/json:
              schema:
                type: object
                properties:
                  levels:
                    type: array
                    items:
                      $ref: '#/components/schemas/CefrLevel'
                    description: Array of CEFR levels
              examples:
                success:
                  summary: All CEFR levels
                  value:
                    levels:
                      - id: 1
                        code: "A1"
                        name: "Beginner"
                        description: "Basic user"
                      - id: 2
                        code: "A2"
                        name: "Elementary"
                        description: "Basic user"
        '500':
          $ref: '#/components/responses/InternalServerError'

components:
  schemas:
    Game:
      type: object
      required:
        - game_id
        - code
        - name
        - description
        - display_order
        - is_active
        - created_at
        - updated_at
      properties:
        game_id:
          type: integer
          description: Unique identifier for the game
          example: 1
        code:
          type: string
          description: Machine-readable game code
          example: "vocab-quiz"
        name:
          type: string
          description: Display name of the game
          example: "Vocabulary Quiz"
        description:
          type: string
          description: Short description of the game
          example: "Match words with their definitions."
        icon_path:
          type: string
          nullable: true
          description: Relative path to game icon
          example: "/games/vocab-quiz.svg"
        category:
          type: string
          nullable: true
          description: Game category
          example: "vocabulary"
        display_order:
          type: integer
          description: Display order (lower = displayed first)
          example: 1
        is_active:
          type: boolean
          description: Whether the game is active
          example: true
        created_at:
          type: string
          format: date-time
          description: Creation timestamp
          example: "2025-11-01T00:00:00Z"
        updated_at:
          type: string
          format: date-time
          description: Last update timestamp
          example: "2025-11-01T00:00:00Z"

    LeaderboardEntry:
      type: object
      required:
        - user_id
        - username
        - score
        - rank
      properties:
        user_id:
          type: integer
          description: Unique identifier for the user
          example: 1
        username:
          type: string
          description: Display name of the user
          example: "player1"
        score:
          type: number
          description: User's best score for this game
          example: 950
        rank:
          type: integer
          description: User's rank in the leaderboard (1-based)
          example: 1

    VocabQuizLeaderboardEntry:
      type: object
      required:
        - user_id
        - username
        - accuracy_percentage
        - games_played
        - rank
      properties:
        user_id:
          type: integer
          description: Unique identifier for the user
          example: 1
        username:
          type: string
          description: Display name of the user
          example: "player1"
        accuracy_percentage:
          type: number
          description: User's accuracy percentage (0-100)
          example: 95.5
        games_played:
          type: integer
          description: Number of games played (minimum 5 required)
          example: 10
        rank:
          type: integer
          description: User's rank in the leaderboard (1-based)
          example: 1

    VocabQuizLeaderboardResponse:
      type: object
      required:
        - game_id
        - cefr_level_id
        - cefr_level_code
        - translation_direction
        - leaderboard
      properties:
        game_id:
          type: integer
          description: The game ID
          example: 2
        cefr_level_id:
          type: integer
          description: The CEFR level ID
          example: 1
        cefr_level_code:
          type: string
          description: The CEFR level code
          example: "A1"
        translation_direction:
          type: string
          enum: [en-to-vi, vi-to-en]
          description: Translation direction
          example: "en-to-vi"
        leaderboard:
          type: array
          items:
            $ref: '#/components/schemas/VocabQuizLeaderboardEntry'
          description: Array of top 10 leaderboard entries (may be empty)

    CefrLevel:
      type: object
      required:
        - id
        - code
        - name
      properties:
        id:
          type: integer
          description: Unique identifier for the CEFR level
          example: 1
        code:
          type: string
          description: CEFR level code
          example: "A1"
        name:
          type: string
          description: Full name of the CEFR level
          example: "Beginner"
        description:
          type: string
          nullable: true
          description: Description of the level
          example: "Basic user"

  responses:
    BadRequest:
      description: Bad request - invalid parameters
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
                example: "Invalid game ID"
              message:
                type: string
                example: "Game ID must be a valid integer"

    InternalServerError:
      description: Internal server error
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
                example: "Internal server error"
              message:
                type: string
                example: "Failed to retrieve games"

